name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/quint-pwa]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Collect site files
        run: |
          mkdir _site
          # everything the app serves; new folders are picked up automatically
          git archive HEAD | tar -x -C _site
          rm -rf _site/.github _site/README.md
          test -f _site/vendor/three.module.min.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
